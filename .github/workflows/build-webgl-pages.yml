name: Build WebGL iPhone Preview

permissions:
  contents: read
  pages: write
  id-token: write

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-webgl-pages.yml"
      - "Assets/**"
      - "Packages/**"
      - "ProjectSettings/**"
  workflow_dispatch:
    inputs:
      bundle_version:
        description: "Visible app version"
        required: true
        default: "1.0"

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-webgl:
    name: Build Unity WebGL
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-

      - name: Free runner disk space
        run: |
          docker system prune -af || true
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet || true

      - name: Build WebGL player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.4.5f1
          targetPlatform: WebGL
          buildMethod: AichiFantasy.Editor.AichiFantasyWebGlBuilder.BuildWebGlPlayer
          customParameters: >-
            -webglBuildPath build/WebGL
            -bundleVersion ${{ github.event_name == 'workflow_dispatch' && inputs.bundle_version || '1.0-pages' }}

      - name: Validate WebGL files
        run: |
          set -euo pipefail
          test -f build/WebGL/index.html
          test -d build/WebGL/Build
          test -d build/WebGL/TemplateData

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/WebGL

  deploy-pages:
    name: Deploy iPhone preview
    runs-on: ubuntu-latest
    needs: build-webgl
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Write preview summary
        run: |
          {
            echo "## AichiFantasyTRPG WebGL iPhone Preview"
            echo ""
            echo "Open this URL on iPhone Safari:"
            echo ""
            echo "${{ steps.deployment.outputs.page_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
